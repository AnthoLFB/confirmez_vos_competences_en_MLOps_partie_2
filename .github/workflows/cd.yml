name: CD - Build & Deploy

on:
  workflow_run:
    workflows: ["CI - Tests & Lint"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # S'exécute si le CI a réussi OU si lancé manuellement
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Se connecter au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
          # Force la mise en minuscules du nom de l'image
          flavor: |
            latest=true

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker exige des noms en minuscules, on force la conversion ici
          build-args: |
            REPO_NAME=${{ github.repository }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Déployer le conteneur (simulation locale)
        run: |
          # Conversion du nom du repo en minuscules pour Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "=== Déploiement de l'image ghcr.io/${REPO_LOWER}:latest ==="
          docker pull ghcr.io/${REPO_LOWER}:latest
          docker run -d --name scoring-api \
            -p 8000:8000 \
            -e API_KEY=${{ secrets.API_KEY }} \
            ghcr.io/${REPO_LOWER}:latest
          echo "Conteneur démarré. Attente du health-check..."
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          echo "✅ Déploiement réussi – API opérationnelle."
